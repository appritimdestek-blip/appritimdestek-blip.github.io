<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>App Ritim</title>
<meta name="description" content="App Ritim: adımlarını say, su iç, iyi uyu. Seriyi koru, arkadaşlarınla yarış.">
<link rel="icon" href="ikon.png">
<style>
:root { --bg: #0C0E14; --ink: #F2F4F6; --muted: #B4BAC2; --gold: #F7DC8C; --acc: #FF8A5C; --line: rgba(255, 255, 255, 0.14); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: radial-gradient(60vmax 60vmax at 0% 0%, rgba(255, 138, 92, 0.18), transparent 60%), var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; display: flex; }
main { max-width: 640px; margin: auto; padding: 48px 16px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
img { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 14px 36px rgba(255, 138, 92, 0.3); }
h1 { margin: 8px 0 0; font-size: 44px; line-height: 1.1; }
.tag { margin: 0; color: var(--gold); font-weight: 700; font-size: 19px; }
.feats { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0; padding: 0; list-style: none; }
.feats li { padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.05); font-weight: 600; }
p { color: var(--muted); margin: 0; }
.links { display: flex; flex-wrap: wrap; justify-content: center; gap: 16px; margin-top: 16px; }
a { color: var(--acc); font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="ikon.png" alt="App Ritim simgesi">
  <h1>App Ritim</h1>
  <p class="tag">Günün ritmini yakala 🔥</p>
  <ul class="feats"><li>👟 Adım</li><li>💧 Su</li><li>🌙 Uyku</li><li>🏆 Arkadaşlarla yarış</li></ul>
  <p>Adımlarını say, suyunu takip et, uykunu düzenle. Serini koru, rozet kazan, arkadaşlarınla haftalık yarışa katıl. Yakında Google Play'de.</p>
  <div class="links">
    <a href="gizlilik.html">Gizlilik politikası</a>
    <a href="gizlilik.html#hesap-silme">Hesap silme</a>
    <a href="mailto:appritim.destek@gmail.com">İletişim</a>
  </div>
</main>
</body>
</html>
